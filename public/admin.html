<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Maaz Mehar Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>Admin Login</h1>
      <p>Upload projects & certificates to your portfolio.</p>
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username" />
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit">Sign In</button>
      <p class="msg" id="loginMsg"></p>
      <a href="/">← Back to portfolio</a>
    </form>
  </div>

  <div id="dashView" class="dash" hidden>
    <aside class="sidebar">
      <h2>Maaz <span>Admin</span></h2>
      <nav>
        <button class="tab-btn active" data-tab="projects"><i class="fas fa-briefcase"></i> Projects</button>
        <button class="tab-btn" data-tab="certificates"><i class="fas fa-certificate"></i> Certificates</button>
      </nav>
      <div class="sidebar-foot">
        <a href="/" target="_blank">View Site</a>
        <button id="logoutBtn">Logout</button>
      </div>
    </aside>

    <main class="main">
      <section id="tab-projects" class="tab-panel active">
        <header class="panel-head">
          <h1>Projects</h1>
          <p>Add project images, links, and descriptions.</p>
        </header>

        <form class="upload-form" id="projectForm" enctype="multipart/form-data">
          <div class="grid-2">
            <div>
              <label>Title *</label>
              <input type="text" name="title" required />
            </div>
            <div>
              <label>Tech (comma separated)</label>
              <input type="text" name="tech" placeholder="React, Node, MongoDB" />
            </div>
          </div>
          <label>Description *</label>
          <textarea name="description" required rows="3"></textarea>
          <div class="grid-2">
            <div>
              <label>Live URL</label>
              <input type="url" name="liveUrl" placeholder="https://" />
            </div>
            <div>
              <label>GitHub URL</label>
              <input type="url" name="githubUrl" placeholder="https://" />
            </div>
          </div>
          <label>Project Image</label>
          <input type="file" name="image" accept="image/*" />
          <button type="submit"><i class="fas fa-plus"></i> Add Project</button>
          <p class="msg" id="projectMsg"></p>
        </form>

        <div class="list" id="projectList"></div>
      </section>

      <section id="tab-certificates" class="tab-panel">
        <header class="panel-head">
          <h1>Certificates</h1>
          <p>Upload certificate images for the portfolio gallery.</p>
        </header>

        <form class="upload-form" id="certForm" enctype="multipart/form-data">
          <div class="grid-2">
            <div>
              <label>Title *</label>
              <input type="text" name="title" required />
            </div>
            <div>
              <label>Issuer</label>
              <input type="text" name="issuer" placeholder="Coursera, Udemy…" />
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Year</label>
              <input type="text" name="year" placeholder="2026" />
            </div>
            <div>
              <label>Certificate Image *</label>
              <input type="file" name="image" accept="image/*" required />
            </div>
          </div>
          <button type="submit"><i class="fas fa-upload"></i> Upload Certificate</button>
          <p class="msg" id="certMsg"></p>
        </form>

        <div class="list" id="certList"></div>
      </section>
    </main>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
